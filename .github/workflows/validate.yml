name: IPOS.Plan checks

on:
  pull_request:
    branches: [main, design/ipos-plan-2, design/ipos-2-task-sections-2026-10-20, fix/ipos-3-0-1-ux-reliability]
  push:
    branches: [main, design/ipos-plan-2, design/ipos-2-task-sections-2026-10-20, feat/ipos-plan-3-workspace]

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Independently validate DOCX archive and OOXML
        run: |
          python3 - <<'PY'
          from zipfile import ZipFile
          from xml.etree import ElementTree as ET
          filename = "/tmp/ipos-export-smoke.docx"
          with ZipFile(filename) as archive:
              assert archive.testzip() is None, "Corrupted DOCX ZIP contents"
              required = ["[Content_Types].xml", "_rels/.rels",
                          "word/document.xml", "word/styles.xml",
                          "word/header1.xml", "word/_rels/document.xml.rels"]
              for name in required:
                  ET.fromstring(archive.read(name))
              print("DOCX ZIP CRC and all critical OOXML files are valid")
          PY
      - run: npm run build
      - name: Install Chromium for UI validation
        run: npx playwright install --with-deps chromium
      - name: Verify editor, responsive viewer, data safety and portable media
        run: npm run test:e2e
