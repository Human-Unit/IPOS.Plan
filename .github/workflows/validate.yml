name: IPOS.Plan checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run mcp:preflight:test
      - name: Independently validate DOCX archive and OOXML
        run: |
          python3 - <<'PY'
          from zipfile import ZipFile
          from xml.etree import ElementTree as ET
          filename = "/tmp/ipos-export-smoke.docx"
          with ZipFile(filename) as archive:
              assert archive.testzip() is None, "Corrupted DOCX ZIP contents"
              required = ["[Content_Types].xml", "_rels/.rels",
                          "word/document.xml", "word/styles.xml",
                          "word/header1.xml", "word/_rels/document.xml.rels"]
              for name in required:
                  ET.fromstring(archive.read(name))
              print("DOCX ZIP CRC and all critical OOXML files are valid")
          PY
      - run: npm run build
      - name: Install Chromium for UI validation
        run: npx playwright install --with-deps chromium
      - name: Verify editor, responsive viewer, data safety and portable media
        run: npm run test:e2e
      - name: Retain browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-evidence
          path: |
            test-results/
            playwright-report/
          retention-days: 7
